<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11131A" />
      <stop offset="100%" stop-color="#090A0D" />
    </linearGradient>

    <!-- Emerald Path Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Emerald Glow -->
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Pruned Fade Gradient -->
    <linearGradient id="prunedGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4B5563" />
      <stop offset="70%" stop-color="#374151" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1F2937" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Cinema Card Frame -->
  <rect x="16" y="16" width="224" height="224" rx="36" fill="url(#bgGrad)" stroke="#1E2230" stroke-width="4" />

  <!-- Subtle Film Perforations at Top and Bottom -->
  <rect x="40" y="28" width="16" height="10" rx="3" fill="#1E2230" />
  <rect x="76" y="28" width="16" height="10" rx="3" fill="#1E2230" />
  <rect x="112" y="28" width="16" height="10" rx="3" fill="#1E2230" />
  <rect x="148" y="28" width="16" height="10" rx="3" fill="#1E2230" />
  <rect x="184" y="28" width="16" height="10" rx="3" fill="#1E2230" />

  <rect x="40" y="218" width="16" height="10" rx="3" fill="#1E2230" />
  <rect x="76" y="218" width="16" height="10" rx="3" fill="#1E2230" />
  <rect x="112" y="218" width="16" height="10" rx="3" fill="#1E2230" />
  <rect x="148" y="218" width="16" height="10" rx="3" fill="#1E2230" />
  <rect x="184" y="218" width="16" height="10" rx="3" fill="#1E2230" />

  <!-- 3-Branch Decision DAG: Top and Bottom branches PRUNED, Center LOCKED -->
  
  <!-- Root Node (Left) -->
  <circle cx="56" cy="128" r="8" fill="#9CA3AF" />

  <!-- Branch 1: Top Pruned (Discarded Option 1) -->
  <path d="M 56 128 C 84 128, 88 80, 118 80" stroke="url(#prunedGrad)" stroke-width="4" stroke-dasharray="6 4" fill="none" />
  <circle cx="118" cy="80" r="6" fill="#374151" stroke="#4B5563" stroke-width="2" />
  <!-- Small Prune Cut indicator -->
  <path d="M 112 74 L 124 86 M 124 74 L 112 86" stroke="#EF4444" stroke-width="2" stroke-linecap="round" />

  <!-- Branch 3: Bottom Pruned (Discarded Option 3) -->
  <path d="M 56 128 C 84 128, 88 176, 118 176" stroke="url(#prunedGrad)" stroke-width="4" stroke-dasharray="6 4" fill="none" />
  <circle cx="118" cy="176" r="6" fill="#374151" stroke="#4B5563" stroke-width="2" />
  <!-- Small Prune Cut indicator -->
  <path d="M 112 170 L 124 182 M 124 170 L 112 182" stroke="#EF4444" stroke-width="2" stroke-linecap="round" />

  <!-- Branch 2: Center LOCKED (The Single Pure 'noslop' Golden Path) -->
  <path d="M 56 128 L 140 128" stroke="url(#emeraldGrad)" stroke-width="6" stroke-linecap="round" filter="url(#emeraldGlow)" />
  <circle cx="98" cy="128" r="5" fill="#34D399" />
  <circle cx="140" cy="128" r="8" fill="#10B981" filter="url(#emeraldGlow)" />

  <!-- Right Aperture / Clapper Cinema Terminal -->
  <g transform="translate(148, 92)">
    <!-- Cinema Frame / Viewfinder -->
    <rect x="0" y="0" width="72" height="72" rx="14" fill="#11131A" stroke="url(#emeraldGrad)" stroke-width="3.5" filter="url(#emeraldGlow)" />
    <!-- Aperture / Play triangle mark -->
    <path d="M 28 22 L 50 36 L 28 50 Z" fill="url(#emeraldGrad)" />
    <!-- Crosshair ticks -->
    <line x1="36" y1="8" x2="36" y2="14" stroke="#34D399" stroke-width="2.5" stroke-linecap="round" />
    <line x1="36" y1="58" x2="36" y2="64" stroke="#34D399" stroke-width="2.5" stroke-linecap="round" />
    <line x1="8" y1="36" x2="14" y2="36" stroke="#34D399" stroke-width="2.5" stroke-linecap="round" />
    <line x1="58" y1="36" x2="64" y2="36" stroke="#34D399" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>

