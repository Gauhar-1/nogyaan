<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>nogyaan Studio — The Director's Treatment</title>
  <link rel="icon" type="image/png" href="/assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400&family=Playfair+Display:ital,wght@0,500;0,700;1,400;1,600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            serif: ['Merriweather', 'Playfair Display', 'Georgia', 'serif'],
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'Menlo', 'monospace']
          }
        }
      }
    };
  </script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="/vendor/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    :root {
      --bg: #000000;
      --surface: #0A0A0A;
      --surface-card: #121212;
      --border: #262626;
      --border-light: #404040;
      --text-white: #FFFFFF;
      --text-gray: #A3A3A3;
      --text-muted: #737373;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-serif: 'Merriweather', 'Playfair Display', Georgia, serif;
      --font-mono: 'JetBrains Mono', ui-monospace, Menlo, Monaco, Consolas, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text-white);
      font-family: var(--font-sans);
      min-height: 100vh;
      overflow-x: hidden;
      line-height: 1.5;
    }

    /* Fixed Stark Monochrome Header (52px) */
    header.global-app-header {
      height: 52px;
      border-bottom: 1px solid var(--border);
      background-color: rgba(0, 0, 0, 0.96);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo-mark {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border-radius: 4px;
      overflow: hidden;
      filter: grayscale(100%);
    }

    .logo-mark img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .app-title {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: var(--text-white);
      text-transform: uppercase;
      font-family: var(--font-mono);
    }

    .header-badge {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 3px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-gray);
    }

    .header-action-btn {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 5px 14px;
      border-radius: 3px;
      border: 1px solid var(--border-light);
      background: var(--surface-card);
      color: var(--text-white);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .header-action-btn:hover {
      background: #FFFFFF;
      color: #000000;
      border-color: #FFFFFF;
    }

    /* Custom Toast Notification */
    .toast-msg {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #FFFFFF;
      color: #000000;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 10px 18px;
      border-radius: 4px;
      box-shadow: 0 4px 20px rgba(255, 255, 255, 0.15);
      z-index: 1000;
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }

    .toast-msg.show {
      transform: translateY(0);
      opacity: 1;
    }

    /* Custom Scrollbar for Stark Dark Aesthetic */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #000000;
    }

    ::-webkit-scrollbar-thumb {
      background: #262626;
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #404040;
    }

  </style>
</head>
<body>

  <!-- Fixed Top Header (Strictly Monochrome, Zero Icons) -->
  <header class="global-app-header">
    <div class="brand-section">
      <div class="logo-mark">
        <img src="/assets/logo.png" alt="nogyaan" onerror="if(!this.dataset.tried){this.dataset.tried='1';this.src='../../assets/logo.png';}" />
      </div>
      <span class="app-title">NOGYAAN STUDIO</span>
      <span class="header-badge">THE DIRECTOR'S TREATMENT</span>
    </div>

    <div class="flex items-center gap-3">
      <!-- Feature 1: Native JSON-to-PDF Export Button -->
      <button onclick="window.exportNativeBlueprintPdf && window.exportNativeBlueprintPdf()" class="header-action-btn">
        EXPORT BLUEPRINT TO PDF
      </button>
      <span class="header-badge">READ-ONLY LIVE VIEWER</span>
    </div>
  </header>

  <!-- Treatment Root Mount Point -->
  <div id="treatment-root" class="flex w-full min-h-[calc(100vh-52px)] bg-black"></div>

  <!-- Toast Notification -->
  <div class="toast-msg" id="toast-msg">PROMPT COPIED TO CLIPBOARD</div>

  <script>
    function showToast(msg) {
      const t = document.getElementById('toast-msg');
      if (!t) return;
      t.textContent = msg || 'PROMPT COPIED TO CLIPBOARD';
      t.classList.add('show');
      setTimeout(() => {
        t.classList.remove('show');
      }, 2000);
    }

    function exportNativeBlueprintPdf(customState) {
      const s = customState || window.__currentNogyaanState;
      if (!s) {
        showToast('AWAITING NOGYAAN ENGINE STATE...');
        return;
      }

      const jsPdfClass = window.jspdf && (window.jspdf.jsPDF || window.jspdf);
      if (!jsPdfClass) {
        showToast('DOWNLOADING BLUEPRINT PDF...');
        const exportSession = s.project_id || s.sessionId || '';
        const exportUrl = '/api/v2/export-pdf' + (exportSession ? ('?session=' + encodeURIComponent(exportSession)) : '');
        window.location.href = exportUrl;
        return;
      }

      showToast('GENERATING BLUEPRINT PDF...');
      try {
        const doc = new jsPdfClass({
          orientation: 'portrait',
          unit: 'pt',
          format: 'a4'
        });

        const pageWidth = doc.internal.pageSize.getWidth();
        const pageHeight = doc.internal.pageSize.getHeight();
        const marginLeft = 45;
        const marginRight = 45;
        const contentWidth = pageWidth - marginLeft - marginRight;
        const marginTop = 45;
        const marginBottom = 45;
        const maxContentY = pageHeight - marginBottom;

        const projectId = s.project_id || 'NOGYAAN PRODUCTION BLUEPRINT';
        const medium = s.global_medium || 'Live-Action Cinematic';
        const premise = s.core_premise || 'No core premise recorded.';
        const notes = s.global_director_notes || '';
        const assets = s.assets || { characters: {}, backgrounds: {}, product: '' };
        const scenes = s.scenes || [];

        let currentY = marginTop;

        function printRunningHeader(leftText, rightText) {
          doc.setFont('courier', 'bold');
          doc.setFontSize(7.5);
          doc.setTextColor(120, 120, 120);
          doc.text(leftText.toUpperCase(), marginLeft, 32);
          const rWidth = doc.getTextWidth(rightText.toUpperCase());
          doc.text(rightText.toUpperCase(), pageWidth - marginRight - rWidth, 32);
          doc.setDrawColor(220, 220, 220);
          doc.setLineWidth(0.5);
          doc.line(marginLeft, 36, pageWidth - marginRight, 36);
        }

        function drawDivider(y, stroke, gray) {
          doc.setDrawColor(gray || 220, gray || 220, gray || 220);
          doc.setLineWidth(stroke || 0.5);
          doc.line(marginLeft, y, marginLeft + contentWidth, y);
        }

        function ensureSpace(needed, sectionHeader) {
          if (currentY + needed > maxContentY) {
            doc.addPage();
            currentY = marginTop + 10;
            if (sectionHeader) {
              printRunningHeader('ASSET BIBLE (CONTINUED)', projectId);
              currentY += 16;
            }
          }
        }

        // ====================================================================
        // PAGE 1: COVER & CONTEXT
        // ====================================================================

        doc.setFont('courier', 'bold');
        doc.setFontSize(8);
        doc.setTextColor(110, 110, 110);
        doc.text('NOGYAAN STUDIO // PRODUCTION SPECIFICATION BLUEPRINT', marginLeft, currentY);
        const projRight = 'PROJECT: ' + projectId.toUpperCase();
        doc.text(projRight, pageWidth - marginRight - doc.getTextWidth(projRight), currentY);
        currentY += 8;
        drawDivider(currentY, 0.75, 180);
        currentY += 26;

        doc.setFont('helvetica', 'bold');
        doc.setFontSize(22);
        doc.setTextColor(0, 0, 0);
        doc.text("Director's Treatment & SOTA Blueprints", marginLeft, currentY);
        currentY += 16;

        doc.setFont('courier', 'normal');
        doc.setFontSize(9);
        doc.setTextColor(90, 90, 90);
        doc.text('GLOBAL RENDER MEDIUM: [' + medium + '] · SEQUENTIAL STORYBOARD ENGINE', marginLeft, currentY);
        currentY += 12;
        drawDivider(currentY, 1, 60);
        currentY += 22;

        doc.setFont('helvetica', 'bold');
        doc.setFontSize(8.5);
        doc.setTextColor(80, 80, 80);
        doc.text('CAMPAIGN CORE PREMISE & EMOTIONAL GOAL', marginLeft, currentY);
        currentY += 14;

        doc.setFont('times', 'italic');
        doc.setFontSize(11);
        doc.setTextColor(20, 20, 20);
        const premiseLines = doc.splitTextToSize('"' + premise + '"', contentWidth - 18);
        const premiseHeight = premiseLines.length * 14;

        doc.setFillColor(60, 60, 60);
        doc.rect(marginLeft, currentY - 9, 2.5, premiseHeight + 3, 'F');
        doc.text(premiseLines, marginLeft + 12, currentY);
        currentY += premiseHeight + 14;

        if (notes && notes.trim().length > 0) {
          doc.setFont('helvetica', 'bold');
          doc.setFontSize(8);
          doc.setTextColor(90, 90, 90);
          doc.text('PERSISTENT CINEMATIC DIRECTIVES (DIRECTOR NOTES):', marginLeft, currentY);
          currentY += 12;

          doc.setFont('courier', 'normal');
          doc.setFontSize(8.5);
          doc.setTextColor(40, 40, 40);
          const noteLines = doc.splitTextToSize(notes, contentWidth - 16);
          const noteHeight = noteLines.length * 11;
          doc.setFillColor(248, 248, 248);
          doc.setDrawColor(220, 220, 220);
          doc.setLineWidth(0.5);
          doc.rect(marginLeft, currentY - 8, contentWidth, noteHeight + 10, 'FD');
          doc.text(noteLines, marginLeft + 8, currentY + 2);
          currentY += noteHeight + 18;
        }

        drawDivider(currentY, 0.5, 210);
        currentY += 20;

        doc.setFont('helvetica', 'bold');
        doc.setFontSize(10);
        doc.setTextColor(0, 0, 0);
        doc.text('ASSET BIBLE (SPECIFICATIONS)', marginLeft, currentY);
        currentY += 16;

        ensureSpace(45, 'ASSET BIBLE');
        doc.setFont('courier', 'bold');
        doc.setFontSize(8.5);
        doc.setTextColor(50, 50, 50);
        doc.text('HERO PRODUCT [@PROD_01]:', marginLeft, currentY);
        currentY += 12;

        doc.setFont('times', 'normal');
        doc.setFontSize(9.5);
        doc.setTextColor(30, 30, 30);
        const prodText = assets.product || 'Awaiting hero product specification.';
        const prodLines = doc.splitTextToSize(prodText, contentWidth - 10);
        doc.text(prodLines, marginLeft + 10, currentY);
        currentY += prodLines.length * 12 + 14;

        const charEntries = Object.entries(assets.characters || {});
        ensureSpace(35 + charEntries.length * 24, 'ASSET BIBLE');
        doc.setFont('courier', 'bold');
        doc.setFontSize(8.5);
        doc.setTextColor(50, 50, 50);
        doc.text('CHARACTERS (' + charEntries.length + ' REGISTERED):', marginLeft, currentY);
        currentY += 12;

        if (charEntries.length === 0) {
          doc.setFont('times', 'italic');
          doc.setFontSize(9);
          doc.setTextColor(120, 120, 120);
          doc.text('No characters registered.', marginLeft + 10, currentY);
          currentY += 16;
        } else {
          for (let i = 0; i < charEntries.length; i++) {
            const pair = charEntries[i];
            ensureSpace(28, 'ASSET BIBLE');
            const tag = '@' + pair[0].replace(/^@/, '');
            doc.setFont('courier', 'bold');
            doc.setFontSize(8.5);
            doc.setTextColor(0, 0, 0);
            doc.text(tag, marginLeft + 10, currentY);

            doc.setFont('times', 'normal');
            doc.setFontSize(9);
            doc.setTextColor(40, 40, 40);
            const cLines = doc.splitTextToSize(pair[1], contentWidth - 95);
            doc.text(cLines, marginLeft + 85, currentY);
            currentY += Math.max(cLines.length * 11, 14) + 6;
          }
          currentY += 6;
        }

        const bgEntries = Object.entries(assets.backgrounds || {});
        ensureSpace(35 + bgEntries.length * 24, 'ASSET BIBLE');
        doc.setFont('courier', 'bold');
        doc.setFontSize(8.5);
        doc.setTextColor(50, 50, 50);
        doc.text('ENVIRONMENTS (' + bgEntries.length + ' REGISTERED):', marginLeft, currentY);
        currentY += 12;

        if (bgEntries.length === 0) {
          doc.setFont('times', 'italic');
          doc.setFontSize(9);
          doc.setTextColor(120, 120, 120);
          doc.text('No environments registered.', marginLeft + 10, currentY);
          currentY += 16;
        } else {
          for (let i = 0; i < bgEntries.length; i++) {
            const pair = bgEntries[i];
            ensureSpace(28, 'ASSET BIBLE');
            const tag = '@' + pair[0].replace(/^@/, '');
            doc.setFont('courier', 'bold');
            doc.setFontSize(8.5);
            doc.setTextColor(0, 0, 0);
            doc.text(tag, marginLeft + 10, currentY);

            doc.setFont('times', 'normal');
            doc.setFontSize(9);
            doc.setTextColor(40, 40, 40);
            const bLines = doc.splitTextToSize(pair[1], contentWidth - 95);
            doc.text(bLines, marginLeft + 85, currentY);
            currentY += Math.max(bLines.length * 11, 14) + 6;
          }
        }

        // ====================================================================
        // SUBSEQUENT PAGES: THE SCENES & SOTA SHOTS
        // ====================================================================

        scenes.forEach(function(scene, sceneIndex) {
          doc.addPage();
          currentY = marginTop;

          printRunningHeader('ACT 0' + (sceneIndex + 1) + ' // ' + scene.scene_id, projectId);
          currentY += 15;

          const lockedScript = scene.locked_script;
          const scriptStyle = (lockedScript && (lockedScript.style || lockedScript.writer_persona)) || (lockedScript ? 'Locked' : 'Pending');
          const scriptText = (lockedScript && (lockedScript.txt || lockedScript.narrative_block)) || 'Awaiting locked script narrative.';

          doc.setFont('helvetica', 'bold');
          doc.setFontSize(15);
          doc.setTextColor(0, 0, 0);
          doc.text('SCENE: ' + scene.scene_id, marginLeft, currentY);

          doc.setFont('courier', 'bold');
          doc.setFontSize(8.5);
          doc.setTextColor(70, 70, 70);
          const badgeText = 'SCRIPT LOCKED [' + scriptStyle.toUpperCase() + ']';
          doc.text(badgeText, pageWidth - marginRight - doc.getTextWidth(badgeText), currentY);
          currentY += 8;
          drawDivider(currentY, 0.75, 140);
          currentY += 18;

          doc.setFont('helvetica', 'bold');
          doc.setFontSize(8);
          doc.setTextColor(90, 90, 90);
          doc.text('SCENE NARRATIVE & VISUAL INTENT:', marginLeft, currentY);
          currentY += 12;

          doc.setFont('times', 'italic');
          doc.setFontSize(10.5);
          doc.setTextColor(20, 20, 20);
          const scriptLines = doc.splitTextToSize('"' + scriptText + '"', contentWidth - 20);
          const scriptBlockHeight = scriptLines.length * 13;

          doc.setFillColor(60, 60, 60);
          doc.rect(marginLeft, currentY - 8, 2.5, scriptBlockHeight + 2, 'F');
          doc.text(scriptLines, marginLeft + 12, currentY);
          currentY += scriptBlockHeight + 10;

          if (scene.active_refs && scene.active_refs.length > 0) {
            doc.setFont('courier', 'bold');
            doc.setFontSize(7.5);
            doc.setTextColor(90, 90, 90);
            doc.text('ACTIVE REFERENCES: ' + scene.active_refs.join('   '), marginLeft + 12, currentY);
            currentY += 12;
          }

          if (scene.spatial_memory && scene.spatial_memory.length > 0) {
            doc.setFont('courier', 'normal');
            doc.setFontSize(7.5);
            doc.setTextColor(80, 80, 80);
            doc.text('ROOM GEOMETRY: ' + scene.spatial_memory.join(' · '), marginLeft + 12, currentY);
            currentY += 12;
          }

          if (lockedScript && lockedScript.audio_stem) {
            doc.setFont('courier', 'normal');
            doc.setFontSize(7.5);
            doc.setTextColor(100, 100, 100);
            const dialoguePart = lockedScript.audio_stem.dialogue ? 'DIALOGUE: "' + lockedScript.audio_stem.dialogue + '"' : 'DIALOGUE: None';
            const sfxPart = lockedScript.audio_stem.sfx ? 'SFX: ' + lockedScript.audio_stem.sfx : '';
            doc.text(dialoguePart + '  |  ' + sfxPart, marginLeft + 12, currentY);
            currentY += 12;
          }

          currentY += 6;
          drawDivider(currentY, 0.5, 210);
          currentY += 18;

          const shotEntries = Object.entries(scene.shots || {});
          doc.setFont('helvetica', 'bold');
          doc.setFontSize(9);
          doc.setTextColor(0, 0, 0);
          doc.text('DIRECTOR OF PHOTOGRAPHY (DP) COVERAGE (' + shotEntries.length + ' SHOTS)', marginLeft, currentY);
          currentY += 14;

          if (shotEntries.length === 0) {
            doc.setFont('times', 'italic');
            doc.setFontSize(9.5);
            doc.setTextColor(120, 120, 120);
            doc.text('No shots pitched or compiled for this scene yet.', marginLeft + 10, currentY);
            currentY += 20;
            return;
          }

          shotEntries.forEach(function(pair) {
            const shotKey = pair[0];
            const lockedShot = pair[1].locked_shot || pair[1];
            if (!lockedShot) return;

            const shotStyle = lockedShot.style || lockedShot.director_persona || (lockedShot.visual_intent ? 'SOTA Shot' : 'Auteur');
            const shotIntent = lockedShot.visual_intent || lockedShot.txt || 'No visual intent specified.';
            const rawPayload = lockedShot.sota_payload || lockedShot.prmpt || lockedShot.ai_payload || '';
            const formattedPayload = '[' + medium + '] ' + rawPayload;

            doc.setFont('times', 'italic');
            doc.setFontSize(9.5);
            const intentLines = doc.splitTextToSize('"' + shotIntent + '"', contentWidth - 24);
            const intentHeight = intentLines.length * 12;

            doc.setFont('courier', 'normal');
            doc.setFontSize(7.5);
            const payloadLines = doc.splitTextToSize(formattedPayload, contentWidth - 28);
            const payloadBoxHeight = payloadLines.length * 10 + 16;

            const totalShotHeight = 16 + 12 + intentHeight + 14 + payloadBoxHeight + 22;

            if (currentY + totalShotHeight > maxContentY) {
              doc.addPage();
              currentY = marginTop;
              printRunningHeader('ACT 0' + (sceneIndex + 1) + ' // ' + scene.scene_id + ' (CONTINUED)', projectId);
              currentY += 22;
            }

            doc.setFont('courier', 'bold');
            doc.setFontSize(9.5);
            doc.setTextColor(0, 0, 0);
            doc.text(shotKey, marginLeft, currentY);

            doc.setFont('helvetica', 'bold');
            doc.setFontSize(8);
            doc.setTextColor(80, 80, 80);
            doc.text('[' + shotStyle.toUpperCase() + ']', marginLeft + 65, currentY);
            currentY += 6;
            drawDivider(currentY, 0.4, 215);
            currentY += 12;

            doc.setFont('helvetica', 'bold');
            doc.setFontSize(7.5);
            doc.setTextColor(110, 110, 110);
            doc.text('VISUAL INTENT:', marginLeft + 8, currentY);
            currentY += 10;

            doc.setFont('times', 'italic');
            doc.setFontSize(9.5);
            doc.setTextColor(30, 30, 30);
            doc.setFillColor(120, 120, 120);
            doc.rect(marginLeft + 8, currentY - 7, 1.5, intentHeight + 2, 'F');
            doc.text(intentLines, marginLeft + 18, currentY);
            currentY += intentHeight + 10;

            doc.setFont('courier', 'bold');
            doc.setFontSize(7.5);
            doc.setTextColor(90, 90, 90);
            doc.text('AI VIDEO DIFFUSION PAYLOAD (SOTA COMPILATION):', marginLeft + 8, currentY);
            currentY += 8;

            doc.setFillColor(246, 246, 246);
            doc.setDrawColor(215, 215, 215);
            doc.setLineWidth(0.5);
            doc.rect(marginLeft + 8, currentY - 6, contentWidth - 8, payloadBoxHeight, 'FD');

            doc.setFillColor(50, 50, 50);
            doc.rect(marginLeft + 8, currentY - 6, 2.5, payloadBoxHeight, 'F');

            doc.setFont('courier', 'normal');
            doc.setFontSize(7.5);
            doc.setTextColor(25, 25, 25);
            doc.text(payloadLines, marginLeft + 18, currentY + 6);
            currentY += payloadBoxHeight + 18;
          });
        });

        const totalPages = doc.getNumberOfPages();
        for (let p = 1; p <= totalPages; p++) {
          doc.setPage(p);
          const footerY = pageHeight - 25;
          doc.setDrawColor(220, 220, 220);
          doc.setLineWidth(0.5);
          doc.line(marginLeft, footerY - 10, pageWidth - marginRight, footerY - 10);

          doc.setFont('courier', 'normal');
          doc.setFontSize(7.5);
          doc.setTextColor(130, 130, 130);
          doc.text("NOGYAAN STUDIO // DIRECTOR'S BLUEPRINT · PRODUCTION CONFIDENTIAL", marginLeft, footerY);

          const pageStr = 'PAGE ' + p + ' OF ' + totalPages;
          const pageStrWidth = doc.getTextWidth(pageStr);
          doc.setFont('courier', 'bold');
          doc.setTextColor(90, 90, 90);
          doc.text(pageStr, pageWidth - marginRight - pageStrWidth, footerY);
        }

        const outName = (projectId ? projectId.toLowerCase().replace(/[^a-z0-9]+/g, '-') : 'nogyaan') + '-treatment-blueprint.pdf';
        doc.save(outName);
        showToast('BLUEPRINT PDF DOWNLOADED (NATIVE TEXT)');
      } catch (err) {
        console.error('Client PDF generation failed, falling back to server export:', err);
        showToast('DOWNLOADING BLUEPRINT PDF (SERVER)...');
        window.location.href = '/api/v2/export-pdf';
      }
    }
    window.exportNativeBlueprintPdf = exportNativeBlueprintPdf;

    function initDirectorsTreatmentView() {
      const rootEl = document.getElementById('treatment-root');
      if (!rootEl || !window.React || !window.ReactDOM) return;

      const e = React.createElement;

      function DirectorsTreatmentViewer() {
        const [sessions, setSessions] = React.useState([]);
        const [currentSessionId, setCurrentSessionId] = React.useState(function() {
          var params = new URLSearchParams(window.location.search);

                      shotPairs.length === 0
                        ? e('p', { key: 'empty-shots', className: 'text-xs font-mono text-neutral-500 py-3' },
                            'No shots pitched yet for this scene. Call pitch_shot_concepts in chat to generate 3 concepts.'
                          )
                        : e('div', { key: 'shots-list', className: 'space-y-6' },
                            shotPairs.map(function(pair) {
                              var shotKey = pair[0];
                              var shotObj = pair[1]?.locked_shot || pair[1];
                              if (!shotObj || (!shotObj.visual_intent && !shotObj.txt && !shotObj.sota_payload && !shotObj.prmpt)) return null;
                              var shotId = shotObj.id || shotObj.option_id || shotKey;
                              var shotStyle = shotObj.style || shotObj.director_persona || (shotObj.visual_intent ? 'SOTA Shot' : 'Auteur');
                              var shotTxt = shotObj.visual_intent || shotObj.txt || '';
                              var shotPrmpt = shotObj.sota_payload || shotObj.prmpt || shotObj.ai_payload || '';
                              var isCopied = copiedShotId === shotId;
                              var isCollapsed = !!collapsedPayloads[shotId];

                              return e('div', {
                                key: shotKey,
                                className: 'shot-card-container bg-neutral-950 border border-neutral-800 rounded p-5 transition-all'
                              }, [
                                // Shot Card Header with Persona and the ONLY allowed button: Copy AI Payload (Hidden in PDF print)
                                e('div', { key: 'sh-hdr', className: 'flex items-center justify-between mb-3 border-b border-neutral-800 pb-3' }, [
                                  e('div', { key: 'sh-left', className: 'flex items-center gap-2' }, [
                                    e('span', { key: 'k', className: 'font-mono text-xs font-bold px-2 py-0.5 rounded bg-neutral-900 text-white border border-neutral-800' }, shotKey),
                                    e('span', { key: 'p', className: 'text-[10px] font-mono uppercase tracking-wider px-2 py-0.5 rounded bg-neutral-900 text-neutral-300 border border-neutral-800' }, shotStyle)
                                  ]),

                                  // The ONLY button allowed on a Shot Card: Copy AI Payload
                                  e('button', {
                                    key: 'btn-copy',
                                    onClick: function() { handleCopy(shotId, shotPrmpt); },
                                    className: 'px-3 py-1.5 text-xs font-mono font-bold tracking-wider uppercase transition-colors border ' +
                                      (isCopied
                                        ? 'bg-white text-black border-white'
                                        : 'bg-neutral-900 hover:bg-white hover:text-black text-neutral-200 border-neutral-700')
                                  }, isCopied ? 'COPIED' : 'COPY AI PAYLOAD')
                                ]),

                                // Shot Visual Intent (High-End Serif Typography)
                                e('div', { key: 'vi-box', className: 'mb-4' }, [
                                  e('span', { key: 'lbl', className: 'text-[10px] font-mono text-neutral-500 uppercase tracking-widest block mb-1.5' }, 'SHOT VISUAL INTENT'),
                                  e('blockquote', { key: 'quote', className: 'font-serif text-base italic leading-relaxed text-neutral-100 border-l border-neutral-700 pl-3.5 py-0.5' },
                                    '"' + shotTxt + '"'
                                  )
                                ]),

                                // AI Video Diffusion Payload (Collapsible Monospaced Block)
                                e('div', { key: 'ai-box' }, [
                                  e('div', { key: 'ai-hdr', className: 'flex items-center justify-between mb-1.5' }, [
                                    e('span', { key: 'lbl', className: 'text-[10px] font-mono text-neutral-500 uppercase tracking-widest' }, 'AI VIDEO DIFFUSION PAYLOAD (SOTA COMPILATION)'),
                                    e('button', {
                                      key: 'btn-tog',
                                      onClick: function() { toggleCollapse(shotId); },
                                      className: 'text-[10px] font-mono text-neutral-400 hover:text-white transition-colors'
                                    }, isCollapsed ? '[EXPAND]' : '[COLLAPSE]')
                                  ]),
                                  !isCollapsed && e('div', {
                                    key: 'term',
                                    className: 'ai-payload-term bg-black border border-neutral-800 rounded p-3 font-mono text-xs text-neutral-300 leading-relaxed overflow-x-auto block'
                                  }, [
                                    e('span', { key: 'prompt-sign', className: 'text-neutral-500 select-none mr-2' }, '$'),
                                    e('span', { key: 'med-tag', className: 'text-white font-semibold select-none' }, '[' + global_medium + '] '),
                                    e('span', { key: 'body' }, shotPrmpt)
                                  ])
                                ])
                              ]);
                            })
                          )
                    ])
                  ]);
                })
              )
        ]);

        return e('div', { className: 'flex h-[calc(100vh-52px)] w-full bg-black text-neutral-100 font-sans overflow-hidden' }, [
          sidebar,
          timeline
        ]);
      }

      const root = window.ReactDOM.createRoot(rootEl);
      root.render(e(DirectorsTreatmentViewer));
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initDirectorsTreatmentView);
    } else {
      initDirectorsTreatmentView();
    }
  </script>
</body>
</html>
