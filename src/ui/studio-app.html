<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>nogyaan Studio — The Director's Treatment</title>
  <link rel="icon" type="image/png" href="/assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400&family=Playfair+Display:ital,wght@0,500;0,700;1,400;1,600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            serif: ['Merriweather', 'Playfair Display', 'Georgia', 'serif'],
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'Menlo', 'monospace']
          }
        }
      }
    };
  </script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <style>
    :root {
      --bg: #000000;
      --surface: #0A0A0A;
      --surface-card: #121212;
      --border: #262626;
      --border-light: #404040;
      --text-white: #FFFFFF;
      --text-gray: #A3A3A3;
      --text-muted: #737373;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-serif: 'Merriweather', 'Playfair Display', Georgia, serif;
      --font-mono: 'JetBrains Mono', ui-monospace, Menlo, Monaco, Consolas, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text-white);
      font-family: var(--font-sans);
      min-height: 100vh;
      overflow-x: hidden;
      line-height: 1.5;
    }

    /* Fixed Stark Monochrome Header (52px) */
    header.global-app-header {
      height: 52px;
      border-bottom: 1px solid var(--border);
      background-color: rgba(0, 0, 0, 0.96);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo-mark {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border-radius: 4px;
      overflow: hidden;
      filter: grayscale(100%);
    }

    .logo-mark img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .app-title {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: var(--text-white);
      text-transform: uppercase;
      font-family: var(--font-mono);
    }

    .header-badge {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 3px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-gray);
    }

    .header-action-btn {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 5px 14px;
      border-radius: 3px;
      border: 1px solid var(--border-light);
      background: var(--surface-card);
      color: var(--text-white);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .header-action-btn:hover {
      background: #FFFFFF;
      color: #000000;
      border-color: #FFFFFF;
    }

    /* Custom Toast Notification */
    .toast-msg {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #FFFFFF;
      color: #000000;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 10px 18px;
      border-radius: 4px;
      box-shadow: 0 4px 20px rgba(255, 255, 255, 0.15);
      z-index: 1000;
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }

    .toast-msg.show {
      transform: translateY(0);
      opacity: 1;
    }

    /* Custom Scrollbar for Stark Dark Aesthetic */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #000000;
    }

    ::-webkit-scrollbar-thumb {
      background: #262626;
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #404040;
    }

    /* ======================================================================== */
    /* Flawless Monochrome PDF Print Stylesheet                                 */
    /* ======================================================================== */
    @media print {
      @page {
        margin: 15mm;
        size: A4 portrait;
      }

      html, body,
      .h-screen, .max-h-screen, .overflow-hidden,
      [class*="h-screen"], [class*="max-h-screen"], [class*="overflow-hidden"], [class*="overflow-y-auto"],
      #treatment-root, main, aside, div {
        height: auto !important;
        max-height: none !important;
        overflow: visible !important;
      }

      html, body {
        background: #000000 !important;
        color: #FFFFFF !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      header.global-app-header {
        position: static !important;
        border-bottom: 1px solid #333333 !important;
        background: #000000 !important;
        padding: 10px 0 !important;
      }

      #treatment-root {
        display: block !important;
        height: auto !important;
        min-height: auto !important;
        overflow: visible !important;
        background: #000000 !important;
      }

      aside {
        width: 100% !important;
        max-width: 100% !important;
        height: auto !important;
        position: static !important;
        overflow: visible !important;
        border-right: none !important;
        border-bottom: 2px solid #333333 !important;
        margin-bottom: 24px !important;
        page-break-after: avoid !important;
        break-after: avoid !important;
      }

      main {
        width: 100% !important;
        height: auto !important;
        overflow: visible !important;
        padding: 0 !important;
        background: #000000 !important;
      }

      section {
        page-break-inside: avoid !important;
        break-inside: avoid !important;
        margin-bottom: 24px !important;
        border: 1px solid #333333 !important;
        background: #0A0A0A !important;
      }

      .shot-card-container {
        page-break-inside: avoid !important;
        break-inside: avoid !important;
        border: 1px solid #333333 !important;
        background: #0A0A0A !important;
        margin-bottom: 16px !important;
      }

      .ai-payload-term {
        display: block !important;
      }

      .no-print,
      button,
      .toast-msg {
        display: none !important;
      }
    }
  </style>
</head>
<body>

  <!-- Fixed Top Header (Strictly Monochrome, Zero Icons) -->
  <header class="global-app-header">
    <div class="brand-section">
      <div class="logo-mark">
        <img src="/assets/logo.png" alt="nogyaan" onerror="if(!this.dataset.tried){this.dataset.tried='1';this.src='../../assets/logo.png';}" />
      </div>
      <span class="app-title">NOGYAAN STUDIO</span>
      <span class="header-badge">THE DIRECTOR'S TREATMENT</span>
    </div>

    <div class="flex items-center gap-3">
      <!-- Feature 1: Export Blueprint to PDF Button -->
      <button onclick="window.print()" class="no-print header-action-btn">
        EXPORT BLUEPRINT TO PDF
      </button>
      <span class="header-badge">READ-ONLY LIVE VIEWER</span>
    </div>
  </header>

  <!-- Treatment Root Mount Point -->
  <div id="treatment-root" class="flex w-full min-h-[calc(100vh-52px)] bg-black"></div>

  <!-- Toast Notification -->
  <div class="toast-msg" id="toast-msg">PROMPT COPIED TO CLIPBOARD</div>

  <script>
    function showToast(msg) {
      const t = document.getElementById('toast-msg');
      if (!t) return;
      t.textContent = msg || 'PROMPT COPIED TO CLIPBOARD';
      t.classList.add('show');
      setTimeout(() => {
        t.classList.remove('show');
      }, 2000);
    }

    function initDirectorsTreatmentView() {
      const rootEl = document.getElementById('treatment-root');
      if (!rootEl || !window.React || !window.ReactDOM) return;

      const e = React.createElement;

      function DirectorsTreatmentViewer() {
        const [state, setState] = React.useState(null);
        const [isConnected, setIsConnected] = React.useState(false);
        const [copiedShotId, setCopiedShotId] = React.useState(null);
        const [collapsedPayloads, setCollapsedPayloads] = React.useState({});

        React.useEffect(function() {
          function loadInitial() {
            fetch('/api/v2/state')
              .then(function(res) { return res.json(); })
              .then(function(data) { setState(data); })
              .catch(function(err) { console.warn('Failed initial state load:', err); });
          }
          loadInitial();

          var evtSource;
          try {
            evtSource = new EventSource('/api/v2/events');
            evtSource.onopen = function() { setIsConnected(true); };
            evtSource.onmessage = function(ev) {
              try {
                var payload = JSON.parse(ev.data);
                if (payload.type === 'INIT' || payload.type === 'STATE_UPDATED') {
                  setState(payload.state);
                }
              } catch (err) {}
            };
            evtSource.onerror = function() { setIsConnected(false); };
          } catch (err) {
            var interval = setInterval(loadInitial, 3000);
            return function() { clearInterval(interval); };
          }

          return function() {
            if (evtSource) evtSource.close();
          };
        }, []);

        function handleCopy(shotId, payload) {
          var med = (state && state.global_medium) || 'Live-Action Cinematic';
          var fullPrompt = '[' + med + '] ' + payload;
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(fullPrompt);
          } else {
            var ta = document.createElement('textarea');
            ta.value = fullPrompt;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
          }
          setCopiedShotId(shotId);
          showToast('PROMPT COPIED TO CLIPBOARD');
          setTimeout(function() { setCopiedShotId(null); }, 2000);
        }

        function toggleCollapse(shotId) {
          setCollapsedPayloads(function(prev) {
            var next = Object.assign({}, prev);
            next[shotId] = !next[shotId];
            return next;
          });
        }

        if (!state) {
          return e('div', { className: 'flex items-center justify-center h-[calc(100vh-52px)] w-full bg-black text-neutral-400 font-mono text-xs uppercase tracking-widest' },
            'CONNECTING TO NOGYAAN ENGINE...'
          );
        }

        var assets = state.assets || { characters: {}, backgrounds: {}, product: '' };
        var global_medium = state.global_medium || 'Live-Action Cinematic';
        var scenes = state.scenes || [];
        var core_premise = state.core_premise || '';
        var global_director_notes = state.global_director_notes || '';
        var project_id = state.project_id || 'NOGYAAN PRODUCTION';

        // ====================================================================
        // 1. STICKY SIDEBAR: ASSET BIBLE & PERSISTENT RULES (Read-Only 25%)
        // ====================================================================
        var sidebar = e('aside', {
          key: 'sidebar',
          className: 'w-1/4 min-w-[290px] max-w-[360px] h-[calc(100vh-52px)] bg-neutral-950 border-r border-neutral-800 flex flex-col flex-shrink-0 z-20 overflow-y-auto'
        }, [
          // Header
          e('div', { key: 'sb-hdr', className: 'sticky top-0 bg-neutral-950 z-10 p-5 border-b border-neutral-800 flex items-center justify-between' }, [
            e('div', { key: 'title-grp' }, [
              e('h2', { key: 'h2', className: 'text-xs font-bold tracking-widest text-white uppercase font-mono' }, 'ASSET LOCKER'),
              e('span', { key: 'id', className: 'text-[10px] text-neutral-500 font-mono block mt-0.5' }, 'SPECIFICATION BIBLE')
            ]),
            e('span', { key: 'live-badge', className: 'text-[10px] font-mono px-2 py-0.5 rounded border border-neutral-800 bg-neutral-900 text-neutral-400 uppercase tracking-widest' },
              isConnected ? 'LIVE SSE' : 'OFFLINE'
            )
          ]),

          // Global Render Medium Spec (Read-Only)
          e('div', { key: 'medium-box', className: 'p-4 border-b border-neutral-800 bg-neutral-950' }, [
            e('span', { key: 'lbl', className: 'block text-[10px] font-mono font-bold text-neutral-400 uppercase tracking-widest mb-1' }, 'GLOBAL RENDER MEDIUM'),
            e('span', { key: 'val', className: 'text-xs font-mono text-white font-semibold' }, global_medium),
            e('p', { key: 'hint', className: 'mt-1 text-[10px] text-neutral-500 font-mono' }, 'Prepended dynamically to video prompts upon copy.')
          ]),

          // Persistent Cinematic Rules (Read-Only)
          global_director_notes && e('div', { key: 'director-notes-box', className: 'p-4 border-b border-neutral-800 bg-neutral-950' }, [
            e('span', { key: 'lbl', className: 'block text-[10px] font-mono font-bold text-neutral-400 uppercase tracking-widest mb-1' }, 'PERSISTENT CINEMATIC RULES'),
            e('p', { key: 'p', className: 'text-xs font-mono text-neutral-300 leading-relaxed' }, global_director_notes)
          ]),

          // Scrollable Cards List
          e('div', { key: 'cards-scroll', className: 'p-4 space-y-4' }, [
            // Hero Product Card
            e('div', { key: 'prod-card', className: 'bg-neutral-900 border border-neutral-800 rounded p-4' }, [
              e('div', { key: 'hdr', className: 'flex items-center justify-between mb-2' }, [
                e('span', { key: 't', className: 'text-[10px] font-mono font-bold uppercase tracking-widest text-neutral-400' }, 'HERO PRODUCT'),
                e('span', { key: 'b', className: 'text-[10px] font-mono px-2 py-0.5 rounded bg-neutral-800 text-white border border-neutral-700' }, '@PROD_01')
              ]),
              e('p', { key: 'desc', className: 'text-xs text-neutral-300 font-sans leading-relaxed' },
                assets.product || e('span', { className: 'italic text-neutral-500' }, 'Awaiting asset extraction.')
              )
            ]),

            // Characters Card
            e('div', { key: 'char-card', className: 'bg-neutral-900 border border-neutral-800 rounded p-4' }, [
              e('div', { key: 'hdr', className: 'flex items-center justify-between mb-3' }, [
                e('span', { key: 't', className: 'text-[10px] font-mono font-bold uppercase tracking-widest text-neutral-400' }, 'CHARACTERS'),
                e('span', { key: 'b', className: 'text-[10px] font-mono text-neutral-500' }, Object.keys(assets.characters || {}).length + ' TOTAL')
              ]),
              e('div', { key: 'list', className: 'space-y-2.5' },
                Object.keys(assets.characters || {}).length === 0
                  ? [e('p', { key: 'empty', className: 'text-xs italic text-neutral-500' }, 'No characters registered.')]
                  : Object.entries(assets.characters).map(function(pair) {
                      return e('div', { key: pair[0], className: 'p-2.5 rounded bg-neutral-950 border border-neutral-800' }, [
                        e('span', { key: 'id', className: 'text-[11px] font-mono font-bold text-white block' }, '@' + pair[0].replace(/^@/, '')),
                        e('p', { key: 'txt', className: 'text-xs text-neutral-300 mt-1 leading-snug font-sans' }, pair[1])
                      ]);
                    })
              )
            ]),

            // Environments Card
            e('div', { key: 'bg-card', className: 'bg-neutral-900 border border-neutral-800 rounded p-4' }, [
              e('div', { key: 'hdr', className: 'flex items-center justify-between mb-3' }, [
                e('span', { key: 't', className: 'text-[10px] font-mono font-bold uppercase tracking-widest text-neutral-400' }, 'ENVIRONMENTS'),
                e('span', { key: 'b', className: 'text-[10px] font-mono text-neutral-500' }, Object.keys(assets.backgrounds || {}).length + ' TOTAL')
              ]),
              e('div', { key: 'list', className: 'space-y-2.5' },
                Object.keys(assets.backgrounds || {}).length === 0
                  ? [e('p', { key: 'empty', className: 'text-xs italic text-neutral-500' }, 'No environments registered.')]
                  : Object.entries(assets.backgrounds).map(function(pair) {
                      return e('div', { key: pair[0], className: 'p-2.5 rounded bg-neutral-950 border border-neutral-800' }, [
                        e('span', { key: 'id', className: 'text-[11px] font-mono font-bold text-white block' }, '@' + pair[0].replace(/^@/, '')),
                        e('p', { key: 'txt', className: 'text-xs text-neutral-300 mt-1 leading-snug font-sans' }, pair[1])
                      ]);
                    })
              )
            ])
          ])
        ]);

        // ====================================================================
        // 2. MAIN TIMELINE (Read-Only 75% Width)
        // ====================================================================
        var timeline = e('main', {
          key: 'timeline',
          className: 'flex-1 h-[calc(100vh-52px)] overflow-y-auto bg-black p-8 space-y-10'
        }, [
          // Global Document Header with Core Theme & Campaign Goal
          e('header', { key: 'hdr', className: 'border-b border-neutral-800 pb-6 space-y-5' }, [
            e('div', { key: 'top-row', className: 'flex items-center justify-between' }, [
              e('div', { key: 'left' }, [
                e('span', { key: 'sub', className: 'text-[10px] font-mono font-bold tracking-widest uppercase text-neutral-500 block mb-1' }, "THE DIRECTOR'S TREATMENT // READ-ONLY LIVE WORKBENCH"),
                e('h1', { key: 'h1', className: 'text-2xl font-bold tracking-tight text-white font-sans uppercase' }, project_id)
              ]),
              e('div', { key: 'meta-pills', className: 'flex items-center gap-3' }, [
                // Feature 1: Export Blueprint to PDF Button
                e('button', {
                  key: 'btn-export-pdf',
                  onClick: function() { window.print(); },
                  className: 'no-print px-3 py-1.5 text-xs font-mono font-bold tracking-wider uppercase transition-colors border border-neutral-700 bg-neutral-900 hover:bg-white hover:text-black text-neutral-200 rounded cursor-pointer'
                }, 'EXPORT BLUEPRINT TO PDF'),
                e('span', { key: 'med', className: 'text-[10px] font-mono px-2.5 py-1 rounded bg-neutral-900 border border-neutral-800 text-neutral-300 uppercase' }, global_medium),
                e('span', { key: 'cnt', className: 'text-[10px] font-mono px-2.5 py-1 rounded bg-neutral-900 border border-neutral-800 text-neutral-400 uppercase' }, scenes.length + ' SCENES IN SEQUENCE')
              ])
            ]),

            // Prominently Displayed Core Theme / Campaign Goal
            e('div', { key: 'core-theme-box', className: 'p-5 bg-neutral-950 border border-neutral-800 rounded' }, [
              e('span', { key: 'ct-label', className: 'text-[10px] font-mono font-bold tracking-widest uppercase text-neutral-400 block mb-2' }, 'CAMPAIGN CORE PREMISE & EMOTIONAL GOAL'),
              e('p', { key: 'ct-premise', className: 'font-serif text-lg leading-relaxed text-white' },
                core_premise || 'No core campaign premise established yet. Call init_brief and lock_core_theme.'
              ),
              global_director_notes && e('div', { key: 'ct-rules', className: 'mt-3 pt-3 border-t border-neutral-800' }, [
                e('span', { key: 'r-label', className: 'text-[10px] font-mono font-bold tracking-widest uppercase text-neutral-400 block mb-1' }, 'PERSISTENT CINEMATIC DIRECTIVES:'),
                e('p', { key: 'r-text', className: 'font-mono text-xs text-neutral-300' }, global_director_notes)
              ])
            ])
          ]),

          // Scenes Stack
          scenes.length === 0
            ? e('div', { key: 'empty', className: 'border border-dashed border-neutral-800 rounded p-12 text-center' }, [
                e('p', { key: 'p1', className: 'text-base font-semibold text-neutral-300' }, 'No Scenes Created Yet'),
                e('p', { key: 'p2', className: 'text-xs text-neutral-500 mt-2 max-w-md mx-auto font-mono' },
                  'Call pitch_script_options from Claude chat to begin the Writer\'s Room.'
                )
              ])
            : e('div', { key: 'scenes-list', className: 'space-y-12' },
                scenes.map(function(scene, sIdx) {
                  var locked_script = scene.locked_script;
                  var shotsObj = scene.shots || {};
                  var shotPairs = Object.entries(shotsObj);
                  var scriptTxt = (locked_script && (locked_script.txt || locked_script.narrative_block)) || '';
                  var scriptStyle = (locked_script && (locked_script.style || locked_script.writer_persona)) || 'Locked';
                  var scriptId = (locked_script && (locked_script.id || locked_script.option_id)) || scene.scene_id;

                  return e('section', {
                    key: scene.scene_id || sIdx,
                    className: 'bg-neutral-950 border border-neutral-800 rounded p-6'
                  }, [
                    // Scene Top Header
                    e('div', { key: 'sc-hdr', className: 'flex items-center justify-between border-b border-neutral-800 pb-4 mb-6' }, [
                      e('div', { key: 'left', className: 'flex items-center gap-3' }, [
                        e('span', { key: 'act', className: 'font-mono text-xs font-bold px-2.5 py-1 rounded bg-neutral-900 border border-neutral-800 text-neutral-300' },
                          'ACT ' + String(sIdx + 1).padStart(2, '0')
                        ),
                        e('h2', { key: 'id', className: 'text-base font-bold text-white tracking-wide font-mono' }, scene.scene_id)
                      ]),
                      locked_script
                        ? e('span', { key: 'st', className: 'text-xs font-mono font-medium px-2.5 py-1 rounded bg-neutral-900 border border-neutral-800 text-neutral-300 uppercase' },
                            'SCRIPT LOCKED (' + scriptStyle + ')'
                          )
                        : e('span', { key: 'st-pen', className: 'text-xs font-mono font-medium px-2.5 py-1 rounded bg-neutral-900 border border-neutral-800 text-neutral-500 uppercase' },
                            'PENDING SCRIPT'
                          )
                    ]),

                    // Surface Crucial State Data: Scene Visual Intent Story Block BEFORE Shot Cards
                    locked_script && e('div', { key: 'script-box', className: 'mb-8 p-5 bg-neutral-900 border border-neutral-800 rounded' }, [
                      e('div', { key: 'hdr', className: 'flex items-center justify-between mb-3 border-b border-neutral-800 pb-2' }, [
                        e('span', { key: 'lbl', className: 'text-[10px] uppercase font-mono font-bold tracking-widest text-neutral-400' }, 'SCENE NARRATIVE // VISUAL INTENT'),
                        e('span', { key: 'id', className: 'text-[10px] font-mono text-neutral-500' }, scriptId)
                      ]),
                      e('p', { key: 'narrative', className: 'font-serif text-base italic leading-relaxed text-neutral-100 mb-4' },
                        '"' + scriptTxt + '"'
                      ),

                      // Active Asset Tags
                      scene.active_refs && scene.active_refs.length > 0 && e('div', { key: 'active-refs-row', className: 'pt-3 border-t border-neutral-800 flex items-center gap-2 mb-3' }, [
                        e('span', { key: 'lbl-ar', className: 'text-[10px] font-mono uppercase tracking-widest text-neutral-400' }, 'ACTIVE REFERENCES:'),
                        e('div', { key: 'pills', className: 'flex flex-wrap gap-1.5' },
                          scene.active_refs.map(function(ref) {
                            return e('span', { key: ref, className: 'text-[10px] font-mono font-semibold px-2 py-0.5 rounded bg-neutral-800 border border-neutral-700 text-neutral-300' }, ref);
                          })
                        )
                      ]),

                      // Rolling Spatial Memory (Room Geometry)
                      scene.spatial_memory && scene.spatial_memory.length > 0 && e('div', { key: 'spatial-memory-row', className: 'pt-3 border-t border-neutral-800 flex flex-col gap-1.5 mb-3' }, [
                        e('span', { key: 'lbl-sm', className: 'text-[10px] font-mono uppercase tracking-widest text-neutral-400 font-semibold' }, 'ROOM GEOMETRY (SPATIAL MEMORY):'),
                        e('div', { key: 'sm-pills', className: 'flex flex-wrap gap-1.5' },
                          scene.spatial_memory.map(function(fact, fIdx) {
                            return e('span', { key: 'sm-' + fIdx, className: 'text-[10px] font-mono px-2 py-0.5 rounded bg-neutral-800 border border-neutral-700 text-neutral-300' }, '[SPATIAL] ' + fact);
                          })
                        )
                      ]),

                      // Temporal Handshake Egress
                      scene.last_shot_egress && e('div', { key: 'temporal-egress-row', className: 'pt-3 border-t border-neutral-800 flex flex-col gap-1.5 mb-3' }, [
                        e('span', { key: 'lbl-eg', className: 'text-[10px] font-mono uppercase tracking-widest text-neutral-400 font-semibold' }, 'TEMPORAL HANDSHAKE (LAST SHOT EGRESS):'),
                        e('span', { key: 'eg-val', className: 'text-xs font-mono text-neutral-300 bg-neutral-950 border border-neutral-800 rounded px-2.5 py-1' }, '[EGRESS] ' + scene.last_shot_egress)
                      ]),

                      // Audio Stems
                      locked_script.audio_stem && e('div', { key: 'audio-stems', className: 'grid grid-cols-1 md:grid-cols-2 gap-3 pt-3 border-t border-neutral-800 text-xs' }, [
                        e('div', { key: 'd-box', className: 'p-3 bg-neutral-950 rounded border border-neutral-800' }, [
                          e('span', { key: 'l', className: 'text-[10px] font-mono font-bold uppercase tracking-widest text-neutral-400 block mb-1' }, 'DIALOGUE (LIP-SYNC STEM)'),
                          e('p', { key: 'v', className: 'font-serif italic text-neutral-200' },
                            locked_script.audio_stem.dialogue ? '"' + locked_script.audio_stem.dialogue + '"' : 'None (Action only)'
                          )
                        ]),
                        e('div', { key: 's-box', className: 'p-3 bg-neutral-950 rounded border border-neutral-800' }, [
                          e('span', { key: 'l', className: 'text-[10px] font-mono font-bold uppercase tracking-widest text-neutral-400 block mb-1' }, 'SFX & AMBIENCE (FOLEY STEM)'),
                          e('p', { key: 'v', className: 'font-mono text-neutral-300' }, locked_script.audio_stem.sfx || 'Ambient soundscape')
                        ])
                      ])
                    ]),

                    // Phase 3: DP Shot Coverage
                    e('div', { key: 'dp-shots' }, [
                      e('div', { key: 'dp-hdr', className: 'flex items-center justify-between mb-4' }, [
                        e('h3', { key: 'title', className: 'text-xs font-mono font-bold uppercase tracking-widest text-neutral-300' }, 'DIRECTOR OF PHOTOGRAPHY (DP) COVERAGE'),
                        e('span', { key: 'cnt', className: 'text-[10px] font-mono text-neutral-500' }, shotPairs.length + ' SHOTS TOTAL')
                      ]),

                      shotPairs.length === 0
                        ? e('p', { key: 'empty-shots', className: 'text-xs font-mono text-neutral-500 py-3' },
                            'No shots pitched yet for this scene. Call pitch_shot_concepts in chat to generate 3 concepts.'
                          )
                        : e('div', { key: 'shots-list', className: 'space-y-6' },
                            shotPairs.map(function(pair) {
                              var shotKey = pair[0];
                              var shotObj = pair[1]?.locked_shot || pair[1];
                              if (!shotObj || (!shotObj.visual_intent && !shotObj.txt && !shotObj.sota_payload && !shotObj.prmpt)) return null;
                              var shotId = shotObj.id || shotObj.option_id || shotKey;
                              var shotStyle = shotObj.style || shotObj.director_persona || (shotObj.visual_intent ? 'SOTA Shot' : 'Auteur');
                              var shotTxt = shotObj.visual_intent || shotObj.txt || '';
                              var shotPrmpt = shotObj.sota_payload || shotObj.prmpt || shotObj.ai_payload || '';
                              var isCopied = copiedShotId === shotId;
                              var isCollapsed = !!collapsedPayloads[shotId];

                              return e('div', {
                                key: shotKey,
                                className: 'shot-card-container bg-neutral-950 border border-neutral-800 rounded p-5 transition-all'
                              }, [
                                // Shot Card Header with Persona and the ONLY allowed button: Copy AI Payload (Hidden in PDF print)
                                e('div', { key: 'sh-hdr', className: 'flex items-center justify-between mb-3 border-b border-neutral-800 pb-3' }, [
                                  e('div', { key: 'sh-left', className: 'flex items-center gap-2' }, [
                                    e('span', { key: 'k', className: 'font-mono text-xs font-bold px-2 py-0.5 rounded bg-neutral-900 text-white border border-neutral-800' }, shotKey),
                                    e('span', { key: 'p', className: 'text-[10px] font-mono uppercase tracking-wider px-2 py-0.5 rounded bg-neutral-900 text-neutral-300 border border-neutral-800' }, shotStyle)
                                  ]),

                                  // The ONLY button allowed on a Shot Card: Copy AI Payload
                                  e('button', {
                                    key: 'btn-copy',
                                    onClick: function() { handleCopy(shotId, shotPrmpt); },
                                    className: 'no-print px-3 py-1.5 text-xs font-mono font-bold tracking-wider uppercase transition-colors border ' +
                                      (isCopied
                                        ? 'bg-white text-black border-white'
                                        : 'bg-neutral-900 hover:bg-white hover:text-black text-neutral-200 border-neutral-700')
                                  }, isCopied ? 'COPIED' : 'COPY AI PAYLOAD')
                                ]),

                                // Shot Visual Intent (High-End Serif Typography)
                                e('div', { key: 'vi-box', className: 'mb-4' }, [
                                  e('span', { key: 'lbl', className: 'text-[10px] font-mono text-neutral-500 uppercase tracking-widest block mb-1.5' }, 'SHOT VISUAL INTENT'),
                                  e('blockquote', { key: 'quote', className: 'font-serif text-base italic leading-relaxed text-neutral-100 border-l border-neutral-700 pl-3.5 py-0.5' },
                                    '"' + shotTxt + '"'
                                  )
                                ]),

                                // AI Video Diffusion Payload (Collapsible Monospaced Block, Always Visible in Print)
                                e('div', { key: 'ai-box' }, [
                                  e('div', { key: 'ai-hdr', className: 'flex items-center justify-between mb-1.5' }, [
                                    e('span', { key: 'lbl', className: 'text-[10px] font-mono text-neutral-500 uppercase tracking-widest' }, 'AI VIDEO DIFFUSION PAYLOAD (SOTA COMPILATION)'),
                                    e('button', {
                                      key: 'btn-tog',
                                      onClick: function() { toggleCollapse(shotId); },
                                      className: 'no-print text-[10px] font-mono text-neutral-400 hover:text-white transition-colors'
                                    }, isCollapsed ? '[EXPAND]' : '[COLLAPSE]')
                                  ]),
                                  e('div', {
                                    key: 'term',
                                    className: 'ai-payload-term bg-black border border-neutral-800 rounded p-3 font-mono text-xs text-neutral-300 leading-relaxed overflow-x-auto ' + (isCollapsed ? 'hidden print:block' : 'block')
                                  }, [
                                    e('span', { key: 'prompt-sign', className: 'text-neutral-500 select-none mr-2' }, '$'),
                                    e('span', { key: 'med-tag', className: 'text-white font-semibold select-none' }, '[' + global_medium + '] '),
                                    e('span', { key: 'body' }, shotPrmpt)
                                  ])
                                ])
                              ]);
                            })
                          )
                    ])
                  ]);
                })
              )
        ]);

        return e('div', { className: 'flex h-[calc(100vh-52px)] w-full bg-black text-neutral-100 font-sans overflow-hidden' }, [
          sidebar,
          timeline
        ]);
      }

      const root = window.ReactDOM.createRoot(rootEl);
      root.render(e(DirectorsTreatmentViewer));
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initDirectorsTreatmentView);
    } else {
      initDirectorsTreatmentView();
    }
  </script>
</body>
</html>
